{% extends 'header.html'%}

{% block content%}

<div class="row">
    <!-- left side bar -->
    <!-- load the side bar here -->
     {% include 'dashboard/sidebar.html'%}
     <!-- right side content -->
      <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center">
            <h2>All categories</h2>

            <a href="{% url 'addcategory' %}" class="btn btn-dark text-light">
                Add Category
            </a>
        </div>
        <table class="table table-hover">
        <thead>
            <tr>
            <th>#</th>
            <th>Category Name</th>
            <th>Created at</th>
            <th>Updated at</th>
            <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{cat.category_name}}</td>
                <td>{{cat.created_at}}</td>
                <td>{{cat.updated_at}}</td>
                <td>
                    <a href="{% url 'editcategory' cat.id %}"><i class="fa-solid fa-pen-to-square text-success"></i></a>
                    &nbsp;
                    <a href="{% url 'deletecategory' cat.id %}"><i class="fa-solid fa-trash text-danger"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
        </table>
      </div>
</div>

{% endblock%}
